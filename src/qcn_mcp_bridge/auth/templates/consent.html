<!-- 同意页 - Phase 2B1 Step 1
场景: 用户已登录 qcn-dev 但未授权该 client.
按接入方案 §C4: 显示 client_name + 申请的 scope, 用户点同意/拒绝.

按 CLAUDE §6.3.2: 不展示 token / session.
按 CLAUDE §4.5: 表单字段 state 透传. -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授权 - 企采牛 MCP Bridge</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; color: #333; }
  h1 { text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
  .card { background: #f9f9f9; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card-title { font-size: 12px; color: #999; margin-bottom: 6px; }
  .card-value { font-size: 16px; font-weight: 500; }
  .scope-list { list-style: none; padding: 0; margin: 0; }
  .scope-list li { padding: 4px 0; font-family: monospace; font-size: 13px; color: #555; }
  .actions { display: flex; gap: 12px; margin-top: 24px; }
  .btn { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-approve { background: #ff6b35; color: white; }
  .btn-deny { background: #f0f0f0; color: #333; }
</style>
</head>
<body>
  <h1>🔐 授权请求</h1>
  <div class="subtitle">企采牛 MCP Bridge</div>

  <div class="card">
    <div class="card-title">应用</div>
    <div class="card-value">{{ client_name }}</div>
  </div>

  <div class="card">
    <div class="card-title">申请权限</div>
    <ul class="scope-list">
      {% for s in scopes %}<li>{{ s }}</li>{% endfor %}
    </ul>
  </div>

  <div class="actions">
    <form method="post" action="/oauth/authorize" style="flex:1;display:flex;gap:12px;">
      <input type="hidden" name="state" value="{{ state }}">
      <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
      <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
      <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
      <input type="hidden" name="client_id" value="{{ client_id }}">
      <input type="hidden" name="decision" value="deny">
      <button type="submit" class="btn btn-deny">拒绝</button>
    </form>
    <form method="post" action="/oauth/authorize" style="flex:1;display:flex;gap:12px;">
      <input type="hidden" name="state" value="{{ state }}">
      <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
      <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
      <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
      <input type="hidden" name="client_id" value="{{ client_id }}">
      <input type="hidden" name="decision" value="approve">
      <button type="submit" class="btn btn-approve">同意</button>
    </form>
  </div>
</body>
</html>
