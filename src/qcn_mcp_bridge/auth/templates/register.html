<!-- 注册页 - Phase 2B1 Step 1
字段 (按 qcn-dev 注册页图3):
  - 手机号
  - 公司 (下拉, 未注册公司可新增)
  - 短信验证码
  - 密码 + 确认密码
  - ☑ 同意《用户服务协议及隐私政策》

按 CLAUDE §6.3.2: 不展示手机验证码 / 密码明文.
按 CLAUDE §4.5: 表单字段为 state 透传. -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号注册 - 企采牛 MCP Bridge</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 420px; margin: 40px auto; padding: 20px; color: #333; }
  h1 { text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; color: #555; font-size: 13px; }
  input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
  input[type=checkbox] { width: auto; }
  button { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-primary { background: #ff6b35; color: white; width: 100%; padding: 12px; }
  .btn-secondary { background: #f0f0f0; color: #333; }
  .btn-secondary:disabled { background: #e0e0e0; color: #999; cursor: not-allowed; }
  .btn-link { background: transparent; color: #ff6b35; text-decoration: underline; padding: 0; border: none; }
  .error-msg { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .row > button { flex: 0 0 auto; }
  .agree-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; margin-bottom: 16px; }
  .agree-group a { color: #ff6b35; text-decoration: none; }
  .footer-link { color: #ff6b35; text-decoration: none; text-align: center; display: block; margin-top: 24px; font-size: 13px; }
</style>
</head>
<body>
  <h1>📝 账号注册</h1>
  <div class="subtitle">企采牛 MCP Bridge</div>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="post" action="/oauth/register-form">
    <input type="hidden" name="state" value="{{ state }}">
    <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
    <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
    <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
    <input type="hidden" name="client_id" value="{{ client_id }}">

    <div class="form-group">
      <label>手机号</label>
      <input type="tel" name="phone" pattern="^1[3-9]\d{9}$" maxlength="11" placeholder="请输入 11 位手机号" required value="{{ phone|default('') }}">
    </div>

    <div class="form-group">
      <label>公司 <small style="color:#999">(未注册公司可填新名称)</small></label>
      {% if companies %}
        <select name="company_select" id="company-select">
            {% for c in companies %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            <option value="__new__">+ 新增公司</option>
        </select>
        <input type="text" name="company_new" id="company-new" placeholder="新公司名称" style="display:none;margin-top:8px;" value="{{ company_new|default('') }}">
        <script>
            const sel = document.getElementById('company-select');
            const newInp = document.getElementById('company-new');
            if (sel && newInp) {
                sel.addEventListener('change', () => {
                    newInp.style.display = sel.value === '__new__' ? 'block' : 'none';
                });
            }
        </script>
        {% else %}
        <input type="text" name="company_new" placeholder="公司名称" required value="{{ company_new|default('') }}">
        {% endif %}
    </div>

    <div class="form-group">
      <label>短信验证码</label>
      <div class="row">
        <input type="text" name="code" placeholder="5-6 位数字" pattern="^\d{5,6}$" maxlength="6" required>
        <button type="button" class="btn-secondary" id="send-code-btn">获取验证码</button>
      </div>
    </div>

    <div class="form-group">
      <label>密码</label>
      <input type="password" name="password" minlength="6" placeholder="至少 6 位" required>
    </div>

    <div class="form-group">
      <label>确认密码</label>
      <input type="password" name="password_confirm" minlength="6" placeholder="再次输入密码" required>
    </div>

    <div class="agree-group">
      <input type="checkbox" id="agree" required>
      <label for="agree">我已阅读并同意 <a href="#" target="_blank">《用户服务协议》</a> 和 <a href="#" target="_blank">《隐私政策》</a></label>
    </div>

    <div class="form-group">
      <button type="submit" class="btn-primary">注册</button>
    </div>
  </form>

  <a class="footer-link" href="/oauth/login-form?state={{ state|urlencode }}&code_challenge={{ code_challenge|urlencode }}&code_challenge_method={{ code_challenge_method|urlencode }}&redirect_uri={{ redirect_uri|urlencode }}&client_id={{ client_id|urlencode }}">已有账号？点此登录</a>

  <script>
    const btn = document.getElementById('send-code-btn');
    let countdown = 0;
    btn.addEventListener('click', async () => {
      const phoneInput = document.querySelector('input[name=phone]');
      const phone = phoneInput.value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) { alert('请输入正确的手机号'); return; }
      btn.disabled = true;
      try {
        const r = await fetch('/oauth/send-code', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({phone}),
        });
        const j = await r.json();
        if (!j.ok) { alert(j.error_description || j.error || '发送失败'); btn.disabled = false; return; }
        countdown = 60;
        const tick = () => {
          btn.textContent = countdown + 's 后重发';
          countdown--;
          if (countdown > 0) setTimeout(tick, 1000);
          else { btn.textContent = '获取验证码'; btn.disabled = false; }
        };
        tick();
      } catch (e) {
        alert('发送失败: ' + e.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
